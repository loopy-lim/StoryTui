[workspace]
resolver = "3"
members = [
    "crates/story-model",
    "crates/story-core",
    "crates/story-import",
    "crates/story-provider",
    "crates/story-persistence",
    "crates/story-tts",
    "crates/story-tui",
    "apps/storytui",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = { version = "1.0.28", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.19"
anyhow = "1.0.104"
toml = "1.1.4"
tracing = "0.1.44"
# Character-card PNG tEXt decoding/encoding for the importer's fixtures.
png = "0.17"
base64 = "0.22"
# RisuAI .charx card container (zip) reading for the importer. Minimal feature
# set — DEFLATE only: the charx spec forbids encryption, so the aes-crypto/
# bzip2/zstd/lzma stack would be dead weight.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tracing-subscriber = "0.3.23"
async-trait = "0.1.91"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
futures-util = "0.3.33"
sha2 = "0.11.0"
tempfile = "3.27.0"
ratatui = "0.30.2"
# default-features off: `chafa-dyn` needs the system libchafa via pkg-config;
# kitty/sixel/halfblocks cover the supported terminals without it.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = "0.25"
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
jsonschema = "0.49.2"
insta = "1.48.0"
# HTTP mock for story-provider contract tests. Justification: async-native
# (built on hyper + tokio), matches the existing reqwest + tokio stack, and its
# `expect(N)` / `received_requests()` API gives the exact request-count
# assertions the 4xx-no-retry / 5xx-retry contract tests need.
wiremock = "0.6"
story-model = { path = "crates/story-model" }
story-core = { path = "crates/story-core" }
story-import = { path = "crates/story-import" }
story-provider = { path = "crates/story-provider" }
story-persistence = { path = "crates/story-persistence" }
story-tts = { path = "crates/story-tts" }
story-tui = { path = "crates/story-tui" }

[profile.release]
lto = "thin"
