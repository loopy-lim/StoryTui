# StoryTUI local OMLX profile. Keep secrets out of this file.
save_dir = "saves"

# Director-Writer 2단계 파이프라인 (기획/선택지 전용 모델 + 서사/글쓰기 전용 모델 분리)
use_director_writer = true

[player]
# 유나는 아래 이름으로 호칭합니다. 비워 두면 모델이 플레이어라고만 부릅니다.
name = ""
# 말투·배경 등 자유 설명. 플레이어의 행동이나 감정을 강제하지는 않습니다.
persona = ""

[provider]
kind = "openai_compatible"
name = "omlx-local"
base_url = "http://127.0.0.1:8000"
chat_path = "/v1/chat/completions"
health_path = "/health"
# OMLX requires an API key for authenticated API routes. The value is read
# from this environment variable and is never written to diagnostics/saves.
# Authentication is optional. For an authenticated server, set either
# api_key_env or api_key_file in a private override profile.
# Low temperature keeps the model focused on the fixed JSON contract.
temperature = 0.2
top_p = 0.92
top_k = 40
# Narration, choices, state_patch and summary share one completion. Reserve
# enough room for a full Korean scene rather than forcing the prose to end
# early once its JSON metadata is emitted.
max_tokens = 8192
# A valid but short scene receives one best-effort rewrite request. If the
# rewrite is still short or malformed, StoryTUI keeps the first valid scene.
min_narration_chars = 1200
request_timeout_ms = 180000
connect_timeout_ms = 3000
max_retries = 2
context_budget_tokens = 24576
# Prefer constrained JSON Schema generation on the local oMLX endpoint. In
# `auto` mode StoryTUI retries once without it only when the server cannot
# satisfy the contract, then disables the capability for that session.
structured_output = "auto"
