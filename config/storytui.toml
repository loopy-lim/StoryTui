# StoryTUI public profile. Keep machine-specific model IDs in the ignored
# config/storytui.local.toml file instead of this tracked template.
save_dir = "saves"

# Director-Writer 2단계 파이프라인 (기획/선택지 전용 모델 + 서사/글쓰기 전용 모델 분리)
# 현재는 OFF: 싱글패스가 로컬에서 더 빠르고, 별도 선택지 품질 게이트가 실패한
# 선택지만 4B 모델로 짧게 다시 만듭니다.
# 폴백(FallbackToSinglePass)이 켜져 있어, true여도 Director 실패 시 막히진 않습니다.
use_director_writer = false

[player]
# 로컬 이름과 persona도 필요하면 storytui.local.toml에서 설정합니다.
name = ""
# 말투·배경 등 자유 설명. 플레이어의 행동이나 감정을 강제하지는 않습니다.
persona = ""

[provider]
kind = "openai_compatible"
# OpenAI 호환 클라우드/게이트웨이는 base_url 교체만으로 연결된다.
# base_url이 /v1으로 끝나면 요청 경로가 자동으로 맞춰진다:
#   base_url = "https://openrouter.ai/api/v1"   # 또는 Groq·LM Studio·OpenAI 등
#   model = "사용하려는-모델-ID"                 # 실제 모델 ID는 storytui.local.toml에
#   api_key_env = "MY_COMPATIBLE_KEY"
name = "omlx-local"
base_url = "http://127.0.0.1:8000"
chat_path = "/v1/chat/completions"
health_path = "/health"
# OMLX requires an API key for authenticated API routes. The value is read
# from this environment variable and is never written to diagnostics/saves.
# Authentication is optional. For an authenticated server, set either
# api_key_env or api_key_file in a private override profile.
# Moderate temperature reduces scene/motif collapse while the schema and
# engine quality gate keep the JSON contract deterministic enough to recover.
temperature = 0.5
top_p = 0.92
top_k = 40
# Narration, choices, state_patch and summary share one completion. Reserve
# enough room for a full Korean scene rather than forcing the prose to end
# early once its JSON metadata is emitted. This output cap is also applied to
# the Director plan (W10 2-stage path), which previously used a hardcoded 1024
# and got truncated mid-JSON ("EOF while parsing").
#
# This is a CAP, not a target: the model stops at finish_reason=stop (a normal
# scene is ~1.5-3k tokens, normally under 90 seconds on the selected Writer model).
# The hard cap also stops a looping model in about two minutes at the measured
# 30 tok/s. Raise only when valid JSON is repeatedly truncated.
max_tokens = 4096
# Length floor for the best-effort rewrite. DISABLED (0): the model routinely
# emitted ~900-1150-char scenes, so a 1200 floor triggered a full regeneration
# almost every turn (~2x latency, then a marginally longer scene). Throwing a
# valid scene away for length is the wrong fix — the right fix is rewriting the
# Writer prompt so the model naturally writes longer scenes. Until then, keep
# the first valid scene as-is. Set >0 to re-enable the rewrite.
min_narration_chars = 0
request_timeout_ms = 600000
connect_timeout_ms = 10000
# One retry (2 attempts). Timeouts are never retried (a slow local model just
# re-waits), and parse/contract retries are capped here too so a single click
# cannot stack into a multi-minute blind wait.
max_retries = 1
# Keep prompt + completion well below a 32K working set. Long sessions use the
# recap/memory selectors instead of sending the entire transcript every turn.
context_budget_tokens = 24576
# Prefer constrained JSON Schema generation on the local oMLX endpoint. In
# `auto` mode StoryTUI retries once without it only when the server cannot
# satisfy the contract, then disables the capability for that session.
structured_output = "auto"

# 추가 프로바이더 프로필: TUI 설정 `e`에서 재시작 없이 전환한다. name은
# [provider] 및 다른 항목과 중복되면 안 된다. 프로필별 기본 역할 모델도
# 지정할 수 있고(전환/시작 시 그 프로필의 배정으로 복원), player가 TUI에서
# 바꾼 값(user-settings의 [stage_models.<name>])이 이 기본값보다 우선한다.
# 실제 모델 ID와 키는 storytui.local.toml에 둔다.
#
# [[providers]]
# name = "openrouter"
# base_url = "https://openrouter.ai/api/v1"
# model = "사용하려는-모델-ID"
# api_key_env = "MY_COMPATIBLE_KEY"
# director_model = "기획-단계-기본-모델"
# choice_model = "선택지-재작성-기본-모델"
# writer_model = "본문-스트리밍-기본-모델"
